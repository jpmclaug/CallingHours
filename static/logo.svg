<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040812" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#0E2750" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="letter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A5C8FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed Background -->
  <rect width="512" height="512" fill="url(#bg-grad)" />
  
  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#halo)" />

  <!-- Stars -->
  <circle cx="70" cy="80" r="1.8" fill="#ffffff" opacity="0.8" />
  <circle cx="430" cy="95" r="1.5" fill="#A5C8FF" opacity="0.7" />
  <circle cx="120" cy="420" r="1.6" fill="#ffffff" opacity="0.65" />
  <circle cx="410" cy="400" r="2.2" fill="#ffffff" opacity="0.8" />
  <circle cx="85" cy="230" r="1.2" fill="#A5C8FF" opacity="0.5" />
  <circle cx="440" cy="250" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="270" cy="55" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="230" cy="450" r="1.4" fill="#A5C8FF" opacity="0.6" />

  <!-- Sparkle Star in Upper Right -->
  <path d="M 395 125 Q 395 140 410 140 Q 395 140 395 155 Q 395 140 380 140 Q 395 140 395 125 Z" fill="#E1E8F0" opacity="0.85" />

  <!-- CH Monogram -->
  <g filter="url(#glow)">
    <!-- C Letter (Arc) -->
    <path d="M 270 145 C 190 145 135 200 135 256 C 135 312 190 367 270 367 C 298 367 320 357 335 342" 
          fill="none" stroke="url(#letter-grad)" stroke-width="38" stroke-linecap="round" />

    <!-- H Letter -->
    <line x1="260" y1="155" x2="260" y2="357" stroke="url(#letter-grad)" stroke-width="38" stroke-linecap="round" />
    <line x1="375" y1="155" x2="375" y2="357" stroke="url(#letter-grad)" stroke-width="38" stroke-linecap="round" />
    <line x1="260" y1="256" x2="375" y2="256" stroke="url(#letter-grad)" stroke-width="38" stroke-linecap="round" />
  </g>
</svg>
